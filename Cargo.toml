[workspace]
members = [".", "deploy/coterie-provision"]

[package]
name = "coterie"
version = "0.1.0"
edition = "2021"

[lib]
name = "coterie"
path = "src/lib.rs"

[[bin]]
name = "coterie"
path = "src/main.rs"

[[bin]]
name = "seed"
path = "src/bin/seed.rs"

[[bin]]
name = "create_admin"
path = "src/bin/create_admin.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros", "multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip", "fs"] }
hyper = { version = "1.0", features = ["full"] }
tokio = { version = "1", features = ["full"] }

# Database. `default-features = false` narrows sqlx to what a SQLite-only
# application uses; the defaults additionally carry `any` (the driver
# multiplexer) and `json`, which nothing here calls. `macros` + `migrate` are
# load-bearing — they back `sqlx::migrate!("./migrations")`.
#
# This does not remove `sqlx-mysql`/`sqlx-postgres` (and so `rsa`,
# RUSTSEC-2023-0071) from Cargo.lock, and never could: they are optional
# dependencies of sqlx, which Cargo records in the lockfile whether or not a
# feature enables them. They were not in the build graph before this either —
# the driver features reach them through weak `sqlx-mysql?/...` references
# that activate nothing. See the waiver in .github/workflows/ci.yml.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros", "migrate"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication & Security
argon2 = { version = "0.4", features = ["std"] }
jsonwebtoken = "10"
rand = "0.9"
axum-extra = { version = "0.9", features = ["cookie"] }
multer = "3"
futures-util = "0.3"
cookie = "0.18"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone database (prebuilt data; no build-script codegen on
# default features). Used to derive UTC from a stored (wall-clock, zone).
chrono-tz = "0.10"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
validator = { version = "0.20", features = ["derive"] }

# Templating
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Payment processing.
# We use the rustls variant rather than the default native-tls / hyper-tls
# combo so the whole binary links against rustls + ring, with no OpenSSL
# dependency. This matches reqwest's "rustls-tls" feature and lets us
# produce a fully static musl binary for Alpine deploys.
stripe = { package = "async-stripe", version = "0.39", default-features = false, features = ["runtime-tokio-hyper-rustls", "checkout", "webhook-events", "connect"] }

# Data generation for seeding (used by seed binary)
fake = { version = "2.9", features = ["derive"] }

# CLI argument parsing (used by seed binary)
clap = { version = "4", features = ["derive"] }
urlencoding = "2.1.3"
tokio-util = { version = "0.7.18", features = ["io"] }

# Email (SMTP via lettre, async on tokio + rustls)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

# Symmetric encryption for secrets-at-rest (e.g. SMTP password stored in DB)
chacha20poly1305 = "0.10"
base64 = "0.22"

# HMAC for stateless CSRF tokens
hmac = "0.12"
subtle = "2.6"

# TOTP (RFC 6238) for admin/member 2FA + QR for the enrollment page.
# `totp-rs` default features pull in qrcodegen-rs and a couple of
# extras we don't need; we render the QR ourselves with `qrcode` so we
# strip them.
totp-rs = { version = "5", default-features = false, features = ["otpauth"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# OpenAPI generation + Swagger UI for the public API surface
# (/api/docs). `utoipa` handlers/DTOs are annotated with macros;
# `utoipa-swagger-ui` exposes the assets via axum routes.
utoipa = { version = "5", features = ["uuid", "chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# HTTP client for outbound integrations (Discord, future Unifi)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_urlencoded = "0.7.1"

# CSV parser for admin bulk-import (member CSV upload). Read-only
# parsing of operator-supplied files; writes use the manual `push_csv`
# helper in `web::portal::admin::csv` to stay aligned with the export
# capability's exact column emission rules.
csv = "1.3"

# Announcement Markdown rendering (see src/util/markdown.rs). comrak
# renders Markdown → HTML with raw-HTML passthrough OFF; ammonia is the
# authoritative sanitizer (safe-subset tag/attr whitelist + URL-scheme
# restriction). Safe Markdown + HTML sanitization is security-critical
# parsing — use the maintained libraries, not a hand-rolled subset.
# comrak default-features off drops the CLI/syntect/clap stack we don't use.
comrak = { version = "0.54", default-features = false }
# 4.1.4 is the floor, not decoration: earlier 4.1.x let SVG `animate`/`set`
# through the sanitizer (RUSTSEC-2026-0213).
ammonia = "4.1.4"

[features]
# Exposes test-only helpers (FakeStripeGateway, etc.) so integration
# tests in tests/ can construct fixtures. Enabled automatically for
# `cargo test`; production builds leave it off.
test-utils = []

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
# Already in the tree via async-stripe; declared here only so the gateway
# cancel-classification unit test can construct a `StripeError::JSONSerialize`.
serde_path_to_error = "0.1"
