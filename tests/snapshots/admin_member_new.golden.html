<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Add New Member - Coterie Admin</title>
    
    <!-- HTMX (self-hosted from /static/js/) -->
    <!-- Self-hosting eliminates the dependency on external CDN
         availability and on visitors' networks not interfering
         with CDN traffic. The version pin lives in the filename
         convention — keep it in lock-step with whatever's in
         static/js/ when upgrading. -->
    <script nonce="__CSP_NONCE__" src="/static/js/htmx.min.js"></script>
    <script nonce="__CSP_NONCE__" src="/static/js/htmx-json-enc.js"></script>

    <!-- Alpine.js CSP build (no `Function()` so works without 'unsafe-eval'). -->
    <script nonce="__CSP_NONCE__" defer src="/static/js/alpine.min.js"></script>

    <!-- Alpine components. The CSP build forbids inline expressions
         (object literals, assignments, comparisons) in x-data/@click/etc.,
         so every component is registered here and templates reference only
         property getters and no-arg methods. Runs during parse, before the
         deferred Alpine boots, so the alpine:init listener is in place. -->
    <script nonce="__CSP_NONCE__">
        document.addEventListener('alpine:init', () => {
            Alpine.data('dropdown', () => ({
                open: false,
                toggle() { this.open = !this.open; },
                close() { this.open = false; },
                get chevron() { return this.open ? 'rotate-180' : ''; },
            }));
            Alpine.data('emailMode', (initial) => ({
                mode: initial,
                get isSmtp() { return this.mode === 'smtp'; },
            }));
            Alpine.data('recurrence', () => ({
                kind: 'none',
                get notNone() { return this.kind !== 'none'; },
                get isWeekly() { return this.kind === 'weekly'; },
                get notWeekly() { return this.kind !== 'weekly'; },
                get isMonthlyDom() { return this.kind === 'monthly_dom'; },
                get isMonthlyWeekday() { return this.kind === 'monthly_weekday'; },
            }));
        });
    </script>

    <!-- Tailwind CSS (locally built) -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- Custom styles -->
    <style>
        [x-cloak] { display: none !important; }

        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
    
    
<meta name="csrf-token" content="">

</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-semibold text-gray-900">
                        Coterie
                    </a>
                    
                    
                </div>
                
                <div class="flex items-center">
                    
                    <a href="/login" class="text-sm text-gray-700 hover:text-gray-900">
                        Login
                    </a>
                    
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Toast notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    

    <!-- Main content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        
<div class="px-4 py-6">
    <!-- Header -->
    <div class="mb-6">
        <div class="flex items-center gap-2 text-sm text-gray-500 mb-2">
            <a href="/portal/admin/members" class="hover:text-gray-700">Members</a>
            <span>/</span>
            <span>Add New Member</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Add New Member</h1>
        <p class="mt-1 text-gray-600">Create a new member account</p>
    </div>

    <div class="max-w-2xl">
        <div class="bg-white rounded-lg shadow-sm">
            <form action="/portal/admin/members/new" method="post" class="p-6 space-y-6">
                <input type="hidden" name="csrf_token" value="">

                <!-- Account Information -->
                <div>
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Account Information</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                                Email <span class="text-red-500">*</span>
                            </label>
                            <input type="email"
                                   id="email"
                                   name="email"
                                   required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="member@example.com">
                        </div>
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                                Username <span class="text-red-500">*</span>
                            </label>
                            <input type="text"
                                   id="username"
                                   name="username"
                                   required
                                   pattern="[a-zA-Z0-9_]+"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="username">
                            <p class="text-xs text-gray-400 mt-1">Letters, numbers, and underscores only</p>
                        </div>
                        <div class="md:col-span-2">
                            <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">
                                Full Name <span class="text-red-500">*</span>
                            </label>
                            <input type="text"
                                   id="full_name"
                                   name="full_name"
                                   required
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="Jane Doe">
                        </div>
                        <div class="md:col-span-2">
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                                Password <span class="text-red-500">*</span>
                            </label>
                            <input type="password"
                                   id="password"
                                   name="password"
                                   required
                                   minlength="10"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                   placeholder="Min 10 chars, upper + lower + number">
                            <p class="text-xs text-gray-400 mt-1">Member can change this after logging in</p>
                        </div>
                    </div>
                </div>

                <!-- Membership Details -->
                <div class="pt-4 border-t">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Membership Details</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="membership_type" class="block text-sm font-medium text-gray-700 mb-1">
                                Membership Type
                            </label>
                            <select id="membership_type_id"
                                    name="membership_type_id"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                
                                <option value="00000000-0000-0000-0000-000000000001">Regular</option>
                                
                            </select>
                        </div>
                        <div>
                            <label for="status" class="block text-sm font-medium text-gray-700 mb-1">
                                Initial Status
                            </label>
                            <select id="status"
                                    name="status"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="Pending">Pending (awaiting payment)</option>
                                <option value="Active">Active</option>
                                <option value="Honorary">Honorary (no dues required)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Admin Notes -->
                <div class="pt-4 border-t">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Admin Notes</h2>
                    <div>
                        <textarea id="notes"
                                  name="notes"
                                  rows="3"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                  placeholder="Internal notes about this member..."></textarea>
                        <p class="text-xs text-gray-400 mt-1">Include "ADMIN" to grant admin privileges</p>
                    </div>
                </div>

                <!-- Actions -->
                <div class="pt-4 border-t flex justify-between items-center">
                    <a href="/portal/admin/members"
                       class="px-4 py-2 text-gray-600 hover:text-gray-800">
                        Cancel
                    </a>
                    <button type="submit"
                            class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-medium">
                        Create Member
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

    </main>

    <!-- Footer: "about this version" affordance.
         Links to the release page for a real release build; dev builds
         (no embedded tag) render the -dev string with no link. -->
    <footer class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-xs text-gray-400">
        
        <span>Coterie </span>
        
    </footer>

    <!-- Loading indicator -->
    <div class="htmx-indicator fixed top-0 left-0 right-0 h-1 bg-blue-600"></div>
    
    <!-- Global scripts -->
    <script nonce="__CSP_NONCE__">
        // HTMX configuration
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-Requested-With'] = 'XMLHttpRequest';

            // Add CSRF token from meta tag if present
            const csrfMeta = document.querySelector('meta[name="csrf-token"]');
            if (csrfMeta) {
                event.detail.headers['X-CSRF-Token'] = csrfMeta.content;
            }
        });
        
        // Handle HTMX errors
        document.body.addEventListener('htmx:responseError', (event) => {
            console.error('HTMX error:', event.detail);
            showToast('An error occurred. Please try again.', 'error');
        });
        
        // Toast notifications
        function showToast(message, type = 'info') {
            const colors = {
                'info': 'bg-blue-500',
                'success': 'bg-green-500',
                'error': 'bg-red-500',
                'warning': 'bg-yellow-500'
            };
            
            const toast = document.createElement('div');
            toast.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg mb-2`;
            toast.textContent = message;
            
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }
        
        // Password length warning. Opt-in per field via `data-max-bytes`;
        // a no-op on every page without one.
        //
        // Warns, never alters: no `maxlength`, no clipping, no blocking of
        // submit. A browser clips a pasted value to `maxlength` with no
        // notice, and on a masked field the user cannot see it happen —
        // they would store a truncated password-manager paste and be locked
        // out of a credential they never chose. `maxlength` also counts
        // UTF-16 code units, not the UTF-8 bytes the server measures, so it
        // could not express the bound anyway. `TextEncoder` counts the same
        // bytes as `validate_password`, so this agrees with the server's
        // message instead of contradicting it.
        const passwordBytes = new TextEncoder();
        document.querySelectorAll('input[type="password"][data-max-bytes]').forEach((input) => {
            const max = Number(input.dataset.maxBytes);
            const warning = document.createElement('p');
            warning.className = 'mt-1 text-xs text-red-600 hidden';
            input.insertAdjacentElement('afterend', warning);
            input.addEventListener('input', () => {
                const size = passwordBytes.encode(input.value).length;
                warning.textContent =
                    `Too long: ${size} bytes (maximum ${max}). The server will reject this.`;
                warning.classList.toggle('hidden', size <= max);
            });
        });

        // Listen for server-sent events for notifications
        document.body.addEventListener('htmx:afterSwap', (event) => {
            if (event.detail.xhr.getResponseHeader('X-Toast')) {
                const toast = JSON.parse(event.detail.xhr.getResponseHeader('X-Toast'));
                showToast(toast.message, toast.type);
            }
        });
    </script>
    
    
</body>
</html>
