<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>Security - Coterie</title>
    
    <!-- HTMX (self-hosted from /static/js/) -->
    <!-- Self-hosting eliminates the dependency on external CDN
         availability and on visitors' networks not interfering
         with CDN traffic. The version pin lives in the filename
         convention — keep it in lock-step with whatever's in
         static/js/ when upgrading. -->
    <script nonce="__CSP_NONCE__" src="/static/js/htmx.min.js"></script>
    <script nonce="__CSP_NONCE__" src="/static/js/htmx-json-enc.js"></script>

    <!-- Alpine.js CSP build (no `Function()` so works without 'unsafe-eval'). -->
    <script nonce="__CSP_NONCE__" defer src="/static/js/alpine.min.js"></script>

    <!-- Alpine components. The CSP build forbids inline expressions
         (object literals, assignments, comparisons) in x-data/@click/etc.,
         so every component is registered here and templates reference only
         property getters and no-arg methods. Runs during parse, before the
         deferred Alpine boots, so the alpine:init listener is in place. -->
    <script nonce="__CSP_NONCE__">
        document.addEventListener('alpine:init', () => {
            Alpine.data('dropdown', () => ({
                open: false,
                toggle() { this.open = !this.open; },
                close() { this.open = false; },
                get chevron() { return this.open ? 'rotate-180' : ''; },
            }));
            Alpine.data('emailMode', (initial) => ({
                mode: initial,
                get isSmtp() { return this.mode === 'smtp'; },
            }));
            Alpine.data('recurrence', () => ({
                kind: 'none',
                get notNone() { return this.kind !== 'none'; },
                get isWeekly() { return this.kind === 'weekly'; },
                get notWeekly() { return this.kind !== 'weekly'; },
                get isMonthlyDom() { return this.kind === 'monthly_dom'; },
                get isMonthlyWeekday() { return this.kind === 'monthly_weekday'; },
            }));
        });
    </script>

    <!-- Tailwind CSS (locally built) -->
    <link rel="stylesheet" href="/static/style.css">

    <!-- Custom styles -->
    <style>
        [x-cloak] { display: none !important; }

        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
    </style>
    
    
<meta name="csrf-token" content="">

</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-xl font-semibold text-gray-900">
                        Coterie
                    </a>
                    
                    
                </div>
                
                <div class="flex items-center">
                    
                    <a href="/login" class="text-sm text-gray-700 hover:text-gray-900">
                        Login
                    </a>
                    
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Toast notifications -->
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    

    <!-- Main content -->
    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        
<div class="px-4 py-6 max-w-3xl">
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-gray-900">Account security</h1>
        <p class="mt-2 text-sm text-gray-600">
            Manage two-factor authentication for your account.
        </p>
    </div>

    

    <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-lg font-semibold mb-2">Two-factor authentication (TOTP)</h2>

        
            <p class="text-sm text-gray-700 mb-4">
                Add an authenticator app (1Password, Authy, Google Authenticator, etc.) for
                a second factor at sign-in. Recommended for admins.
            </p>

            <div id="totp-section">
                <button type="button"
                        hx-post="/portal/profile/security/totp/enroll/start"
                        hx-target="#totp-section"
                        hx-swap="innerHTML"
                        hx-headers='{"X-CSRF-Token": ""}'
                        class="px-4 py-2 text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Enable two-factor authentication
                </button>
            </div>
        
    </div>
</div>

    </main>

    <!-- Footer: "about this version" affordance.
         Links to the release page for a real release build; dev builds
         (no embedded tag) render the -dev string with no link. -->
    <footer class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-xs text-gray-400">
        
        <span>Coterie </span>
        
    </footer>

    <!-- Loading indicator -->
    <div class="htmx-indicator fixed top-0 left-0 right-0 h-1 bg-blue-600"></div>
    
    <!-- Global scripts -->
    <script nonce="__CSP_NONCE__">
        // HTMX configuration
        document.body.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-Requested-With'] = 'XMLHttpRequest';

            // Add CSRF token from meta tag if present
            const csrfMeta = document.querySelector('meta[name="csrf-token"]');
            if (csrfMeta) {
                event.detail.headers['X-CSRF-Token'] = csrfMeta.content;
            }
        });
        
        // Handle HTMX errors
        document.body.addEventListener('htmx:responseError', (event) => {
            console.error('HTMX error:', event.detail);
            showToast('An error occurred. Please try again.', 'error');
        });
        
        // Toast notifications
        function showToast(message, type = 'info') {
            const colors = {
                'info': 'bg-blue-500',
                'success': 'bg-green-500',
                'error': 'bg-red-500',
                'warning': 'bg-yellow-500'
            };
            
            const toast = document.createElement('div');
            toast.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg mb-2`;
            toast.textContent = message;
            
            document.getElementById('toast-container').appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 5000);
        }
        
        // Listen for server-sent events for notifications
        document.body.addEventListener('htmx:afterSwap', (event) => {
            if (event.detail.xhr.getResponseHeader('X-Toast')) {
                const toast = JSON.parse(event.detail.xhr.getResponseHeader('X-Toast'));
                showToast(toast.message, toast.type);
            }
        });
    </script>
    
    
</body>
</html>
