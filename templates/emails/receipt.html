<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Payment receipt</title></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #1f2937;">
    <h1 style="font-size: 20px; margin-bottom: 16px;">Payment receipt</h1>
    <p>Hi {{ full_name }},</p>
    <p>Thanks — we've received your payment to <strong>{{ org_name }}</strong>.</p>
    <table style="border-collapse: collapse; margin: 20px 0; font-size: 15px;">
        <tr><td style="padding: 4px 16px 4px 0; color:#6b7280;">Amount</td><td style="padding: 4px 0;"><strong>{{ amount }}</strong></td></tr>
        <tr><td style="padding: 4px 16px 4px 0; color:#6b7280;">Date</td><td style="padding: 4px 0;">{{ date }}</td></tr>
        <tr><td style="padding: 4px 16px 4px 0; color:#6b7280;">For</td><td style="padding: 4px 0;">{{ description }}</td></tr>
        <tr><td style="padding: 4px 16px 4px 0; color:#6b7280;">Receipt</td><td style="padding: 4px 0;">{{ receipt_id }}</td></tr>
    </table>
    <p style="margin: 28px 0;">
        <a href="{{ receipt_url }}" style="background:#2563eb;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;display:inline-block;">View &amp; print receipt</a>
    </p>
    <p style="font-size: 13px; color: #6b7280;">Or open {{ receipt_url }} in your browser. Keep this for your records.</p>
    <p style="font-size: 13px; color: #6b7280;">— {{ org_name }}</p>
</body>
</html>
