name: CI

# Runs tests on every push to master and every PR, and — on master only —
# warms the shared build cache that the tag-triggered Release workflow reads.
#
# Why this exists: GitHub Actions caches are only readable from the same ref,
# its base, or the DEFAULT branch. Release builds run on tag refs, so they can
# only reuse a cache produced on master. Nothing built on master before, so
# every release started from a cold cache (~10 min). This job produces that
# cache under the SAME key release.yml looks up, so releases restore deps and
# only recompile the leaf crates.

on:
  push:
    branches: [master, dev]
  pull_request:
  # For the advisory job below. An advisory is news about code already shipped,
  # so a check that only fired on pushes would be silent exactly when it
  # matters: a crate we already depend on becomes vulnerable without anything
  # here changing. Off-the-hour to miss the top-of-hour cron rush.
  schedule:
    - cron: '17 6 * * *'

# Supersede in-progress runs for the same ref — but only for pull requests.
# Pushing three times to a PR branch in a minute otherwise leaves three full
# builds racing to tell you about the first commit. Branch pushes are NOT
# cancelled: those are the runs that save the shared build cache, and killing
# one halfway leaves the next release build to start cold.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job here reads the repository and writes nothing back to it, so the
# token says exactly that. Workflow-level rather than per-job: all three jobs
# need the same thing, and a job added later inherits the floor instead of the
# repository default. Pinning bounds WHEN third-party code is adopted; this
# bounds what it can reach once running.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and warm cache
    runs-on: ubuntu-latest
    # The daily schedule exists for the advisory job; re-running the full build
    # on it would spend ~10 minutes to re-learn what the last push already said.
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch — moving ref, pinned 2026-07-09
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # Reclaim ~20GB of unused preinstalled SDKs so the heavy build can't
      # exhaust the runner disk. None are used by a Rust build.
      - name: Free up runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      # SAME key as release.yml so a default-branch run's cache is what tag
      # builds read. Shared cache with release.yml (same shared-key). rust-cache
      # keeps target/ trimmed to deps, so the cache stays small enough to avoid
      # runner disk-full.
      #
      # Saves only on the DEFAULT branch, resolved at run time rather than named
      # here. A tag ref can restore a cache from its own ref, its base, or the
      # default branch — nothing else — so the saving branch and the default
      # branch have to be the same one. Hardcoding a name means the day the
      # default changes, releases silently start building cold with nothing
      # failing to say so.
      - name: Rust build cache (save on the default branch, restore elsewhere)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: musl-release
          save-if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}

      # Debug tests: fast to compile, same correctness signal as release-mode.
      - name: Test
        run: cargo test --features test-utils

      # Warm the exact artifacts the Release build needs (musl-static, release
      # profile). Only on the default branch, for the same reason the cache
      # saves there: a cache written from any other ref is one tag builds
      # cannot read, so warming elsewhere spends ten minutes for nothing.
      - name: Warm release build (musl)
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --bins
          cargo build --release --target x86_64-unknown-linux-musl -p coterie-provision

  # Its own job rather than a step in `test`: an advisory failure and a test
  # failure call for different responses, and separate jobs say which one
  # happened without anyone opening a log.
  audit:
    name: Advisory check (RustSec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch — moving ref, pinned 2026-07-09

      # Fixed key, unlike the per-ref rust-cache above, because the cached copy
      # is only a warm start: `cargo audit` fetches advisory-db updates itself on
      # every run, so freshness never depends on this. Saving a new entry per run
      # would buy nothing and push the musl-release cache toward the 10GB
      # eviction limit. Bump the suffix to pick up a newer cargo-audit.
      - name: Cache advisory database and cargo-audit
        id: audit-cache
        # Same pin as deploy.yml. These were at v4.3.0 here and v6.1.0 there —
        # each matching its own comment, so a per-pin check passed both while
        # this job silently ran an older action. That split is what the `pins`
        # job below now refuses.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/advisory-db
            ~/.cargo/bin/cargo-audit
          key: cargo-audit-v1

      - name: Install cargo-audit
        if: steps.audit-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      # Reads Cargo.lock, so the whole resolved graph is covered — most of what
      # the application is exposed to never appears in a Cargo.toml. Exits
      # non-zero naming the crate when a RustSec advisory matches.
      - name: cargo audit
        run: cargo audit

  # The `# vX.Y.Z` beside every pinned SHA is decorative — GitHub resolves the
  # SHA and never reads the comment — so a pin that never pointed where it said
  # is invisible to review. This resolves each claim upstream and compares.
  #
  # Runs on the daily schedule too, unlike `test`: a tag moved or deleted
  # upstream is news that arrives without anything here changing, and the check
  # costs seconds rather than the ten minutes a build would.
  pins:
    name: Verify action pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read-only API calls; the token is here for the rate limit, not access.
      # No toolchain, no cache, no build — the workflow files are the input.
      - name: Verify action pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/verify_action_pins.py
